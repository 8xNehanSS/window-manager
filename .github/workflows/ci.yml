name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -short skips the tests that open real windows, which need an
      # interactive desktop session.
      - name: Test
        run: go test -short ./...

  release:
    name: Build and release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p build dist
          for arch in amd64 arm64; do
            name="window-manager-${VERSION}-windows-${arch}"
            mkdir -p "build/${name}"
            GOOS=windows GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-H windowsgui -s -w -X main.version=${VERSION}" \
              -o "build/${name}/window-manager.exe" .
            cp README.md "build/${name}/"
            (cd build && zip -qr "../dist/${name}.zip" "${name}")
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: window-manager-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            # Re-running the workflow for an existing tag: replace the files.
            gh release upload "$VERSION" dist/* --clobber
          else
            flags=()
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag "${flags[@]}"
          fi
